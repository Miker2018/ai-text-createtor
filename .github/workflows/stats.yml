name: stats

# 每天 01:00 UTC 汇总 Release 下载量，回写 stats/usage.json。
# 不采集客户端心跳：activeInstalls 由人手动维护，脚本原样保留。

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh stats/usage.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-stats.mjs --repo "${{ github.repository }}"

      - name: Commit if changed
        run: |
          if git diff --quiet -- stats/usage.json; then
            echo "usage.json 无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/usage.json
          git commit -m "chore(stats): 刷新使用量统计"
          git push
